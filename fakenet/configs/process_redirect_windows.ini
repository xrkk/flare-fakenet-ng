[FakeNet]
DivertTraffic: Yes

[Diverter]
NetworkMode: SingleHost
DebugLevel: Off
# FakeNet PCAP records are policy-observation views. The VM acceptance runner
# uses independent pktmon capture as the wire-side source of truth.
DumpPackets: Yes
DumpPacketsFilePrefix: process_redirect_packets
FixGateway: No
FixDNS: No
ModifyLocalDNS: Yes
StopDNSService: No
RedirectAllTraffic: Yes
DefaultTCPListener: ProxyTCPListener
DefaultUDPListener: ProxyUDPListener
BlackListPortsTCP: 139
BlackListPortsUDP: 67, 68, 137, 138, 443, 1900, 5355

ExternalAccessPolicy: EgressControl
ExternalAllowedDomains: api.deepseek.com
ExternalAllowedTCPPorts: 443
ExternalDnsServer: __RUNTIME_EXTERNAL_DNS__
ExternalDnsTimeout: 3
ExternalVerifyTLSSNI: Yes
ExternalRelayPort: 38927
ExternalTLSHelloTimeout: 5
ExternalTLSHelloMaxBytes: 65536
ExternalMaxPendingFlows: 256
ExternalMaxPendingPerSource: 32
ExternalMaxActiveRelays: 128
ExternalMaxActivePerSource: 16
ExternalRelayIdleTimeout: 300
ExternalRelayBufferBytes: 1048576
ExternalNonAllowedAction: Divert
ExternalBlockExternalIPv6: Yes
ExternalBlockQUIC: Yes

# These six values form one immutable, manifest-bound Windows rule. The VM
# runner may replace only the reviewed package markers; it never asks for a
# process, address, port, DNS fallback, or weaker identity selector.
ExternalProcessRedirectEnabled: Yes
ExternalProcessRedirectProtocol: TCP
ExternalProcessRedirectImagePath: __RUNTIME_PROCESS_IMAGE_PATH__
ExternalProcessRedirectImageSHA256: __RUNTIME_PROCESS_IMAGE_SHA256__
ExternalProcessRedirectOriginalIPv4: __RUNTIME_PUBLIC_IPV4_A__
ExternalProcessRedirectTargetIPv4: __RUNTIME_PRIVATE_IPV4_B__
# Known limitation (bundled WinDivert 1.3): the capture layer does not reliably
# intercept a small number of late, OS-generated teardown packets (FIN/RST) for
# already-closed redirected connections. These are payload-free signaling
# packets; all connection DATA is redirected correctly (owner-gate 10,000/10,000
# validated). Under the strict wire-side "no original-A traffic" gate this shows
# up as a handful of teardown-only packets to the original address. This is a
# WinDivert 1.3 capture limitation, not a diverter bug -- the diverter never
# receives these packets (verified v22). See PLAN §24.29. Accepted as known.

[ProxyTCPListener]
Enabled: True
Protocol: TCP
Listener: ProxyListener
Port: 38926
Listeners: RawTCPListener, DNSUDPServer, DNSTCPServer
Hidden: False
Static_CA: No
CA_Cert: configs/fakenet_ca.crt
CA_Key: configs/fakenet_ca.key

[ProxyUDPListener]
Enabled: True
Protocol: UDP
Listener: ProxyListener
Port: 38926
Listeners: RawUDPListener, DNSUDPServer, DNSTCPServer
Hidden: False

[RawTCPListener]
Enabled: True
Port: 1337
Protocol: TCP
Listener: RawListener
UseSSL: No
Timeout: 10
Hidden: False

[RawUDPListener]
Enabled: True
Port: 1337
Protocol: UDP
Listener: RawListener
UseSSL: No
Timeout: 10
Hidden: False

[DNSUDPServer]
Enabled: True
Port: 53
Protocol: UDP
Listener: DNSListener
ResponseA: GetFirstNonLoopback
ResponseMX: mail.evil2.com
ResponseTXT: FAKENET
NXDomains: 0
Hidden: False

[DNSTCPServer]
Enabled: True
Port: 53
Protocol: TCP
Listener: DNSListener
ResponseA: GetFirstNonLoopback
ResponseMX: mail.evil2.com
ResponseTXT: FAKENET
NXDomains: 0
Timeout: 5
Hidden: False

[DomainEgressRelay]
Enabled: True
Port: 38927
Protocol: TCP
Listener: DomainEgressRelay
Hidden: True
