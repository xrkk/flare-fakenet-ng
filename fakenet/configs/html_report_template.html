<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FakeNet-NG payload report</title>
  <style>
    :root { color-scheme: dark; --bg:#2e3440; --panel:#3b4252; --ink:#eceff4;
            --muted:#d8dee9; --accent:#88c0d0; --bad:#bf616a; --good:#a3be8c; }
    body { margin:0; padding:1.5rem; background:var(--bg); color:var(--ink);
           font-family:"Courier New",monospace; line-height:1.4; }
    main { max-width:100rem; margin:auto; }
    h1 { margin-top:0; font-size:1.8rem; }
    h2 { font-size:1.2rem; margin-bottom:.4rem; }
    .panel { background:var(--panel); border-radius:.35rem; padding:1rem;
             margin:0 0 1rem; overflow-wrap:anywhere; }
    .health { display:grid; grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));
              gap:.5rem; list-style:none; padding:0; }
    .health li { padding:.5rem; background:var(--bg); border-left:.3rem solid var(--good); }
    .health li.bad { border-left-color:var(--bad); }
    .flow { border-top:1px solid #4c566a; padding-top:.8rem; margin-top:.8rem; }
    .flow:first-child { border-top:0; margin-top:0; }
    .meta { color:var(--muted); }
    .payload { margin:.5rem 0 0; padding:.6rem; background:var(--bg); }
    .payload pre { white-space:pre-wrap; word-break:break-all; max-height:28rem;
                   overflow:auto; margin:.3rem 0; }
    button { color:var(--bg); background:var(--accent); border:0; border-radius:.2rem;
             padding:.35rem .6rem; cursor:pointer; font-family:inherit; }
    input { color:var(--ink); background:var(--bg); border:1px solid var(--muted);
            padding:.5rem; width:min(100%,34rem); font-family:inherit; }
    .hidden { display:none; }
    .error { color:#bf616a; }
  </style>
</head>
<body>
<main>
  <h1>FakeNet-NG payload report</h1>
  <section class="panel" aria-labelledby="capture-heading">
    <h2 id="capture-heading">Capture health</h2>
    <ul id="health" class="health"></ul>
    <p id="limitation" class="error"></p>
  </section>
  <section class="panel" aria-labelledby="flow-heading">
    <h2 id="flow-heading">TCP/UDP payloads</h2>
    <label for="search">Search flows </label>
    <input id="search" type="search" autocomplete="off">
    <div id="flows"></div>
  </section>
  <section class="panel" aria-labelledby="nbi-heading">
    <h2 id="nbi-heading">Listener NBI (interpretation layer)</h2>
    <pre id="nbis"></pre>
  </section>
</main>

<!-- The only byte-bearing source is this inert, escaped JSON model. -->
<script type="application/json" id="payload-data">{{ payload_report_json|safe }}</script>
<script>
(function () {
  "use strict";
  var state;
  var source = document.getElementById("payload-data");
  try { state = JSON.parse(source.textContent || "{}"); }
  catch (error) {
    var failure = document.createElement("p");
    failure.className = "error";
    failure.textContent = "Unable to read payload report model.";
    document.getElementById("flows").appendChild(failure);
    return;
  }

  function text(parent, value) {
    var node = document.createElement("span");
    node.textContent = String(value === undefined || value === null ? "" : value);
    parent.appendChild(node);
    return node;
  }
  function line(parent, label, value) {
    var row = document.createElement("div");
    var name = document.createElement("strong");
    name.textContent = label + ": ";
    row.appendChild(name);
    text(row, value);
    parent.appendChild(row);
  }
  function bytesFromBase64(value) {
    var binary = atob(value || "");
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  function hex(bytes) {
    var result = [];
    for (var i = 0; i < bytes.length; i += 1) {
      result.push(bytes[i].toString(16).padStart(2, "0"));
    }
    return result.join("");
  }
  function utf8(bytes) {
    try { return new TextDecoder("utf-8", {fatal:true}).decode(bytes); }
    catch (error) { return null; }
  }
  function copy(value, button) {
    var done = function () { button.textContent = "Copied"; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(value).then(done, function () {});
    }
  }
  function directionBlock(parent, direction) {
    var panel = document.createElement("div");
    panel.className = "payload";
    line(panel, "Direction", direction.direction);
    line(panel, "Endpoints", (direction.source.ip + ":" + direction.source.port +
                              " -> " + direction.destination.ip + ":" +
                              direction.destination.port));
    line(panel, "Bytes", direction.bytes);
    line(panel, "SHA-256", direction.sha256);
    var bytes = bytesFromBase64(direction.base64);
    var base64Row = document.createElement("div");
    var base64Label = document.createElement("strong");
    base64Label.textContent = "Base64: ";
    base64Row.appendChild(base64Label);
    text(base64Row, direction.base64);
    var button = document.createElement("button");
    button.type = "button";
    button.textContent = "Copy Base64";
    button.addEventListener("click", function () { copy(direction.base64, button); });
    base64Row.appendChild(document.createTextNode(" "));
    base64Row.appendChild(button);
    panel.appendChild(base64Row);
    var hexPre = document.createElement("pre");
    hexPre.textContent = hex(bytes);
    panel.appendChild(hexPre);
    var decoded = utf8(bytes);
    var textLabel = document.createElement("div");
    textLabel.textContent = decoded === null ? "UTF-8 text unavailable (bytes shown losslessly)." : decoded;
    panel.appendChild(textLabel);
    if (direction.datagrams) {
      var datagrams = document.createElement("div");
      line(datagrams, "UDP datagrams", direction.datagrams.length);
      direction.datagrams.forEach(function (datagram) {
        line(datagrams, "datagram " + datagram.ordinal,
             "offset=" + datagram.offset + " length=" + datagram.length +
             " sha256=" + datagram.sha256);
      });
      panel.appendChild(datagrams);
    }
    parent.appendChild(panel);
  }
  function render() {
    var health = document.getElementById("health");
    health.textContent = "";
    var capture = state.capture || {};
    ["writer_health", "coverage_health", "reassembly_health", "overall_health"].forEach(function (key) {
      var item = document.createElement("li");
      if (!capture[key]) item.className = "bad";
      text(item, key + "=" + String(capture[key]));
      health.appendChild(item);
    });
    document.getElementById("limitation").textContent = capture.limitation || "";
    var root = document.getElementById("flows");
    root.textContent = "";
    (state.flows || []).forEach(function (flow) {
      var card = document.createElement("article");
      card.className = "flow";
      card.dataset.search = JSON.stringify(flow).toLowerCase();
      line(card, "Flow", flow.id);
      line(card, "Protocol", flow.protocol);
      line(card, "Owner", flow.owner + " / pid=" + flow.pid + " / process=" + flow.process);
      line(card, "Disposition", flow.disposition + " / domain=" + flow.domain);
      Object.keys(flow.directions || {}).forEach(function (key) {
        directionBlock(card, flow.directions[key]);
      });
      root.appendChild(card);
    });
    document.getElementById("nbis").textContent = JSON.stringify(state.nbis || [], null, 2);
  }
  render();
  document.getElementById("search").addEventListener("input", function (event) {
    var query = event.target.value.toLowerCase();
    document.querySelectorAll(".flow").forEach(function (flow) {
      flow.classList.toggle("hidden", query !== "" && flow.dataset.search.indexOf(query) === -1);
    });
  });
}());
</script>
</body>
</html>
