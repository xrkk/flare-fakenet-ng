[FakeNet]
DivertTraffic: Yes

[Diverter]
NetworkMode: SingleHost
DebugLevel: Off
# Independent pktmon capture is the VM acceptance source of truth. Keeping the
# FakeNet writer off avoids synchronous PCAP I/O in the WinDivert hot path.
DumpPackets: No
DumpPacketsFilePrefix: domain_allowlist_packets
FixGateway: No
FixDNS: No
ModifyLocalDNS: Yes
# Domain allow-list authorization does not use DNS client PID attribution.
# Keep Dnscache running to avoid an unnecessary system-service mutation.
StopDNSService: No
RedirectAllTraffic: Yes
DefaultTCPListener: ProxyTCPListener
DefaultUDPListener: ProxyUDPListener
BlackListPortsTCP: 139
BlackListPortsUDP: 67, 68, 137, 138, 443, 1900, 5355

ExternalAccessPolicy: DomainAllowList
ExternalAllowedDomains: api.deepseek.com
ExternalAllowedTCPPorts: 443
# The VM test runner replaces this marker with the pre-FakeNet resolver.
ExternalDnsServer: __EXTERNAL_DNS__
ExternalDnsTimeout: 3
ExternalVerifyTLSSNI: Yes
ExternalRelayPort: 38927
ExternalTLSHelloTimeout: 5
ExternalTLSHelloMaxBytes: 65536
ExternalMaxPendingFlows: 256
ExternalMaxPendingPerSource: 32
ExternalMaxActiveRelays: 128
ExternalMaxActivePerSource: 16
ExternalRelayIdleTimeout: 300
ExternalRelayBufferBytes: 1048576
ExternalNonAllowedAction: Divert
ExternalBlockExternalIPv6: Yes
ExternalBlockQUIC: Yes
# Build-only marker. The source template deliberately grants no public IPv4.
# The v15 builder emits one manifest-bound TCP/443 runtime profile from here.
# __REVIEWED_PUBLIC_IPV4_RULES__

[ProxyTCPListener]
Enabled: True
Protocol: TCP
Listener: ProxyListener
Port: 38926
Listeners: RawTCPListener, DNSUDPServer, DNSTCPServer
Hidden: False
Static_CA: No
CA_Cert: configs/fakenet_ca.crt
CA_Key: configs/fakenet_ca.key

[ProxyUDPListener]
Enabled: True
Protocol: UDP
Listener: ProxyListener
Port: 38926
Listeners: RawUDPListener, DNSUDPServer, DNSTCPServer
Hidden: False

[RawTCPListener]
Enabled: True
Port: 1337
Protocol: TCP
Listener: RawListener
UseSSL: No
Timeout: 10
Hidden: False

[RawUDPListener]
Enabled: True
Port: 1337
Protocol: UDP
Listener: RawListener
UseSSL: No
Timeout: 10
Hidden: False

[DNSUDPServer]
Enabled: True
Port: 53
Protocol: UDP
Listener: DNSListener
ResponseA: GetFirstNonLoopback
ResponseMX: mail.evil2.com
ResponseTXT: FAKENET
NXDomains: 0
Hidden: False

[DNSTCPServer]
Enabled: True
Port: 53
Protocol: TCP
Listener: DNSListener
ResponseA: GetFirstNonLoopback
ResponseMX: mail.evil2.com
ResponseTXT: FAKENET
NXDomains: 0
Timeout: 5
Hidden: False

[DomainEgressRelay]
Enabled: True
Port: 38927
Protocol: TCP
Listener: DomainEgressRelay
Hidden: True
